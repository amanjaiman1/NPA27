<!doctype html>
<html lang="en" data-surface="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080a" />
    <title>Offline · The UPSC Chronicle</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      The service worker's navigation fallback.

      Deliberately a standalone document: no app JavaScript, no build chunks,
      no auth or sleep gate. It has to render when nothing else can.
    -->
    <style>
      :root {
        --ink: 9 9 11;
        --paper: 234 235 240;
        --accent: 240 90 156;
      }
      [data-surface="navy"] {
        --ink: 12 18 38;
        --paper: 223 229 245;
      }
      [data-surface="white"] {
        --ink: 253 250 251;
        --paper: 28 24 32;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: rgb(var(--ink));
        color: rgb(var(--paper));
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .bloom {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      .bloom span {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
      }
      .b1 {
        top: -6rem;
        left: -5rem;
        width: 22rem;
        height: 22rem;
        background: rgb(var(--accent) / 0.22);
      }
      .b2 {
        right: -6rem;
        bottom: -8rem;
        width: 24rem;
        height: 24rem;
        background: rgb(110 168 255 / 0.14);
      }
      .card {
        width: 100%;
        max-width: 26rem;
        padding: 1.75rem;
        border: 1px solid rgb(var(--paper) / 0.12);
        border-radius: 1.25rem;
        background: rgb(var(--ink) / 0.75);
        backdrop-filter: blur(18px);
        box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.6);
        text-align: center;
      }
      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.6rem 0 0;
        font-size: 0.875rem;
        line-height: 1.65;
        color: rgb(var(--paper) / 0.55);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: 1.5rem;
      }
      button,
      a.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.7rem 1rem;
        border-radius: 0.85rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition:
          opacity 0.2s ease,
          border-color 0.2s ease,
          background-color 0.2s ease;
      }
      button {
        border: 0;
        background: rgb(var(--accent));
        color: #1a0e16;
      }
      button:hover {
        opacity: 0.9;
      }
      a.btn {
        border: 1px solid rgb(var(--paper) / 0.14);
        background: rgb(var(--paper) / 0.03);
        color: rgb(var(--paper) / 0.75);
      }
      a.btn:hover {
        border-color: rgb(var(--paper) / 0.3);
        color: rgb(var(--paper));
      }
      .note {
        margin-top: 1.25rem;
        font-size: 0.7rem;
        color: rgb(var(--paper) / 0.35);
      }
      svg {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="bloom"><span class="b1"></span><span class="b2"></span></div>

    <main class="card">
      <!-- The Chronicle mark: the cycle of days, with today lit up. -->
      <svg viewBox="0 0 32 32" width="40" height="40" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="12.5" stroke="rgb(var(--paper) / 0.3)" stroke-width="1.5" />
        <circle cx="16" cy="16" r="7" stroke="rgb(var(--paper) / 0.15)" stroke-width="1.5" />
        <line x1="16" y1="3.5" x2="16" y2="9" stroke="rgb(var(--accent) / 0.5)" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="16" cy="3.5" r="2.4" fill="rgb(var(--accent))" />
      </svg>

      <h1>This page isn’t available offline</h1>
      <p>
        Your chronicle lives on this device, so pages you’ve already opened still
        work without a connection. This one needs the network once — after that
        it’s cached too.
      </p>

      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="btn" href="/">Back to the dashboard</a>
        <a class="btn" href="/journal">Open the journal</a>
      </div>

      <p class="note">Anything you log offline is saved locally and syncs later.</p>
    </main>

    <script>
      // Match the surface the user chose in the app, and retry automatically
      // the moment the connection returns.
      try {
        var s = localStorage.getItem("upsc-chronicle-surface") || "black";
        document.documentElement.setAttribute("data-surface", s);
      } catch (e) {}
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>

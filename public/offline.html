<!doctype html>
<html lang="en" data-surface="white">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4f0" />
    <title>Offline · The UPSC Chronicle</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      The service worker's navigation fallback.

      Deliberately a standalone document: no app JavaScript, no build chunks,
      no auth or sleep gate. It has to render when nothing else can, so the
      design tokens below are a hand-copy of the app's Ivory surface.
    -->
    <style>
      :root {
        --ink: 246 244 240;
        --card: 255 255 255;
        --paper: 34 31 28;
        --line: 226 221 213;
        --accent: 225 29 72;
        --accent-fg: 255 255 255;
        --shadow: 32 26 20;
      }
      [data-surface="black"] {
        --ink: 18 18 20;
        --card: 27 27 31;
        --paper: 242 241 238;
        --line: 46 46 52;
        --accent: 251 74 113;
        --accent-fg: 40 6 16;
        --shadow: 0 0 0;
      }
      [data-surface="navy"] {
        --ink: 15 18 33;
        --card: 23 28 48;
        --paper: 226 231 245;
        --line: 41 48 74;
        --accent: 251 74 113;
        --accent-fg: 40 6 16;
        --shadow: 4 6 20;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: rgb(var(--ink));
        color: rgb(var(--paper));
        font-family:
          ui-rounded, "SF Pro Rounded", "Segoe UI Variable", ui-sans-serif,
          system-ui, -apple-system, Roboto, Arial, sans-serif;
        letter-spacing: -0.011em;
        -webkit-font-smoothing: antialiased;
      }
      .wash {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      .wash span {
        position: absolute;
        border-radius: 9999px;
        filter: blur(110px);
      }
      .w1 {
        top: -10rem;
        left: -10rem;
        width: 30rem;
        height: 30rem;
        background: rgb(var(--accent) / 0.1);
      }
      .w2 {
        right: -8rem;
        bottom: -8rem;
        width: 26rem;
        height: 26rem;
        background: rgb(37 99 235 / 0.07);
      }
      .card {
        width: 100%;
        max-width: 27rem;
        padding: 2rem;
        border: 1px solid rgb(var(--line));
        border-radius: 1.75rem;
        background: rgb(var(--card));
        box-shadow:
          0 1px 2px rgb(var(--shadow) / 0.05),
          0 24px 48px -24px rgb(var(--shadow) / 0.26);
        text-align: center;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto;
        border-radius: 1rem;
        border: 1px solid rgb(var(--line));
      }
      h1 {
        margin: 1.35rem 0 0;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }
      p {
        margin: 0.7rem 0 0;
        font-size: 0.9rem;
        line-height: 1.65;
        color: rgb(var(--paper) / 0.55);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: 1.6rem;
      }
      button,
      a.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        cursor: pointer;
        text-decoration: none;
        transition:
          filter 0.2s ease,
          transform 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
      }
      button {
        border: 0;
        background: rgb(var(--accent));
        color: rgb(var(--accent-fg));
        box-shadow: 0 10px 26px -12px rgb(var(--accent) / 0.55);
      }
      button:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }
      a.btn {
        border: 1px solid rgb(var(--line));
        background: transparent;
        color: rgb(var(--paper) / 0.7);
      }
      a.btn:hover {
        border-color: rgb(var(--paper) / 0.3);
        color: rgb(var(--paper));
        transform: translateY(-1px);
      }
      .note {
        margin-top: 1.4rem;
        font-size: 0.72rem;
        color: rgb(var(--paper) / 0.38);
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wash"><span class="w1"></span><span class="w2"></span></div>

    <main class="card">
      <!-- The Chronicle mark: the cycle of days, with today lit up. -->
      <span class="mark">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="12.5" stroke="rgb(var(--paper) / 0.3)" stroke-width="1.6" />
          <circle cx="16" cy="16" r="7" stroke="rgb(var(--paper) / 0.15)" stroke-width="1.6" />
          <line x1="16" y1="3.5" x2="16" y2="9" stroke="rgb(var(--accent) / 0.55)" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="16" cy="3.5" r="2.4" fill="rgb(var(--accent))" />
        </svg>
      </span>

      <h1>This page isn’t available offline</h1>
      <p>
        Your chronicle lives on this device, so pages you’ve already opened still
        work without a connection. This one needs the network once — after that
        it’s cached too.
      </p>

      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="btn" href="/">Back to the dashboard</a>
        <a class="btn" href="/journal">Open the journal</a>
      </div>

      <p class="note">Anything you log offline is saved locally and syncs later.</p>
    </main>

    <script>
      // Match the surface the user chose in the app, and retry automatically
      // the moment the connection returns.
      try {
        var s = localStorage.getItem("upsc-chronicle-surface") || "white";
        document.documentElement.setAttribute("data-surface", s);
      } catch (e) {}
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>

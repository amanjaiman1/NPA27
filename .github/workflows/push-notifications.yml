name: Push notifications

# Calls the notification dispatcher on a schedule.
#
# This exists because Vercel's Hobby plan runs cron jobs only once a day, which
# would reduce background push to a single morning digest. GitHub's scheduler has
# no such limit, so the committed `vercel.json` stays as a once-daily safety net
# and this drives the real cadence.
#
# Running both is harmless: the engine's own gates — one interruption per subject
# per day, the per-day cap, the minimum gap, one digest per day — are what decide
# whether anything is actually sent, so a duplicate trigger cannot produce a
# duplicate notification.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   PUSH_DISPATCH_URL   https://your-app.vercel.app/api/push/dispatch
#   CRON_SECRET         the same value as the Vercel environment variable
#
# Until both are set this workflow succeeds and does nothing, rather than failing
# every 15 minutes and emailing about it.

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs and can delay them under
    # load, which is fine here: the dispatcher is idempotent and the rules are
    # gated by the hour, not by the minute.
    - cron: "*/15 * * * *"
  # Lets you trigger a run by hand from the Actions tab — the quickest way to
  # test the whole path end to end.
  workflow_dispatch:

# No repository contents are read, and nothing is written back.
permissions: {}

concurrency:
  # If a run is somehow slow, skip rather than pile up.
  group: push-notifications
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the dispatcher
        env:
          URL: ${{ secrets.PUSH_DISPATCH_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "PUSH_DISPATCH_URL or CRON_SECRET is not set — nothing to do."
            echo "Add both under Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # The secret goes in a header, never on the command line, so it cannot
          # end up in the process list or the run log.
          code=$(curl -sS --max-time 60 \
                   -o response.json -w '%{http_code}' \
                   -H "Authorization: Bearer ${SECRET}" \
                   "${URL}")

          echo "HTTP ${code}"
          # The response says how many users were considered, how many pushes
          # went out, and a reason for every user it skipped.
          cat response.json || true
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::Dispatcher returned HTTP ${code}"
            exit 1
          fi
